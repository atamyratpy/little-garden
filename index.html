<!DOCTYPE html>
<html lang="en">
<head>

<style>
  /* ============================================================
     CONFIGURATION
     Change these values to personalize the experience.
  ============================================================ */
  :root{
    --accent: #ff6b8a;
    --accent-soft: #ffb3c6;
    --paper: #f6ecd9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #1a0205 0%, #060002 60%, #010001 100%);
    font-family: 'Georgia', 'Times New Roman', serif;
    cursor: pointer;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.4);
    pointer-events: none;
    letter-spacing: 2px;
    font-style: italic;
    z-index: 10;
    opacity: 1;
  }
  #ui.hint-fade { animation: fadeOut 4s forwards; }
  @keyframes fadeOut {
    to { opacity: 0; }
  }
  
  /* Floating Text Container */
  .floating-text {
    position: absolute;
    pointer-events: none;
    font-family: 'Dancing Script', cursive;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.5px;
    z-index: 20;
    text-shadow: 0 0 30px rgba(255, 100, 150, 0.8);
    transition: all 3.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  
  /* Theme Selector */
  #themeSelector {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    gap: 12px;
    background: rgba(0, 0, 0, 0.5);
    padding: 12px 20px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  #themeSelector button {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
  }
  #themeSelector button:hover {
    transform: scale(1.2);
    border-color: white;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }
  #themeSelector button.active {
    border-color: white;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    transform: scale(1.1);
  }
  #themeSelector button::after {
    content: '';
    position: absolute;
    top: -4px; left: -4px; right: -4px; bottom: -4px;
    border-radius: 50%;
    border: 2px solid transparent;
  }
  #themeSelector button.active::after {
    border-color: white;
  }

  /* Anniversary Timer */
  #timer {
    position: absolute;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    color: rgba(255, 255, 255, 0.3);
    font-size: 13px;
    letter-spacing: 1.5px;
    text-align: center;
    font-family: 'Georgia', serif;
    background: rgba(0, 0, 0, 0.3);
    padding: 8px 20px;
    border-radius: 20px;
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    white-space: nowrap;
    max-width: 92vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #timer span {
    color: rgba(255, 200, 150, 0.7);
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* Photo watermark */
  #photoWatermark {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 10;
    opacity: 0.15;
    font-size: 40px;
    color: rgba(255, 200, 200, 0.3);
    font-family: 'Georgia', serif;
    letter-spacing: 2px;
    pointer-events: none;
    text-shadow: 0 0 30px rgba(255, 100, 150, 0.2);
  }

  /* Music Button */
  #musicBtn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 30;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.4);
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: 12px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }
  #musicBtn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: rgba(255, 255, 255, 0.7);

  /* Heart Counter */
  #heartCounter {

    left: 20px;
    z-index: 15;
    color: rgba(255, 100, 150, 0.4);
    font-size: 14px;

    letter-spacing: 1px;
    pointer-events: none;

  /* ============================================================
     GLOBAL PAGE / SCENE SYSTEM
     The experience is a sequence of full-screen "scenes".
     Only one scene is active (visible) at a time.
  ============================================================ */
  #app { position: relative; width: 100vw; height: 100vh; }

  .scene {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 1.4s ease;
    overflow: hidden;
    z-index: 5;
  }
  .scene.active { opacity: 1; visibility: visible; pointer-events: auto; z-index: 6; }

  /* ---------- LOCK SCREEN ---------- */
  #lockScreen {
    position: fixed; inset: 0; z-index: 999;
    display: flex; align-items: center; justify-content: center;

  @keyframes shakeCard {

  #unlockBtn {

  #lockError {

</style>

function goToScene(name) {
  if (!SCENES.includes(name)) return;
  SCENES.forEach(s => {
    document.getElementById('scene-' + s).classList.toggle('active', s === name);
  });
  currentScene = name;

  if (name === 'garden') {
    const hint = document.getElementById('ui');
    if (!hint.classList.contains('hint-fade')) {
      setTimeout(() => hint.classList.add('hint-fade'), 3000);

============================================================ */

function attemptUnlock() {
  const val = lockPassword.value.trim();
  if (val.toLowerCase() === SITE_PASSWORD.toLowerCase()) {
    lockScreen.classList.add('hidden');
    document.body.style.cursor = 'auto';
    startIntro();

    tryPlayMusic();
  } else {
    lockError.textContent = "This garden isn't meant for everyone.";
    lockError.classList.add('show');
    lockCard.classList.remove('shake');
    // restart animation
    void lockCard.offsetWidth; 
    lockCard.classList.add('shake');
  }
}
document.getElementById('unlockBtn').addEventListener('click', attemptUnlock);
lockPassword.addEventListener('keydown', e => { if (e.key === 'Enter') attemptUnlock(); });

/* ============================================================
   CINEMATIC INTRO
============================================================ */
function startIntro() {
  goToScene('intro');
  initIntroParticles();
  typeIntroLines();
}

function typeIntroLines() {
  const el = document.getElementById('introTypewriter');
  let lineIndex = 0;

  function typeLine() {
    if (lineIndex >= INTRO_LINES.length) {
      setTimeout(() => goToScene('garden'), 1600);
      return;
    }
    const text = INTRO_LINES[lineIndex];
    el.innerHTML = '';
    let charIndex = 0;
    const speed = 45;
    const typer = setInterval(() => {
      el.innerHTML = text.slice(0, charIndex) + '<span class="cursor">|</span>';
      charIndex++;
      if (charIndex > text.length) {
        clearInterval(typer);
        setTimeout(() => {
          lineIndex++;
          typeLine();
        }, 1400);
      }
    }, speed);
  }
  typeLine();
}

document.getElementById('introSkip').addEventListener('click', () => goToScene('garden'));

// Lightweight particle + falling rose petal system for the intro only
function initIntroParticles() {
  const ic = document.getElementById('introCanvas');
  const ictx = ic.getContext('2d');
  let iw, ih;
  function resizeIntro() { iw = ic.width = window.innerWidth; ih = ic.height = window.innerHeight; }
  resizeIntro();
  window.addEventListener('resize', resizeIntro);

  const dust = Array.from({length: 60}, () => ({
    x: Math.random(), y: Math.random(), r: 0.5 + Math.random()*1.5, sp: 0.05 + Math.random()*0.15, phase: Math.random()*Math.PI*2
  }));
  const petals = Array.from({length: 18}, () => resetPetal({}));
  function resetPetal(p) {
    p.x = Math.random() * iw; p.y = -20 - Math.random()*ih;
    p.vy = 0.5 + Math.random()*1.2; p.vx = (Math.random()-0.5)*0.6;
    p.rot = Math.random()*Math.PI*2; p.vr = (Math.random()-0.5)*0.02;
    p.size = 8 + Math.random()*10; p.sway = Math.random()*Math.PI*2;
    return p;
  }

  let raf;
  function loop() {
    if (currentScene !== 'intro') { cancelAnimationFrame(raf); return; }
    ictx.clearRect(0,0,iw,ih);
    dust.forEach(d => {
      d.phase += d.sp * 0.05;
      const a = 0.15 + 0.2*Math.abs(Math.sin(d.phase));
      ictx.beginPath();
      ictx.arc(d.x*iw, d.y*ih, d.r, 0, Math.PI*2);
      ictx.fillStyle = `rgba(255,220,230,${a})`;
      ictx.fill();
    });
    petals.forEach(p => {
      p.sway += 0.02;
      p.x += p.vx + Math.sin(p.sway)*0.5;
      p.y += p.vy;
      p.rot += p.vr;
      if (p.y > ih + 20) resetPetal(p);
      ictx.save();
      ictx.translate(p.x, p.y);
      ictx.rotate(p.rot);
      ictx.fillStyle = 'rgba(255,105,140,0.55)';
      ictx.beginPath();
      ictx.ellipse(0, 0, p.size*0.5, p.size*0.3, 0, 0, Math.PI*2);
      ictx.fill();
      ictx.restore();
    });
    raf = requestAnimationFrame(loop);
  }
  loop();
}

/* ── HELPERS ─────────────────────────────── */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const seg = (p,s,e) => easeOut(clamp((p-s)/(e-s), 0, 1));

function bezPt(x0,y0, cx1,cy1, cx2,cy2, x1,y1, t) {
  const m = 1-t;
  return [
    m*m*m*x0 + 3*m*m*t*cx1 + 3*m*t*t*cx2 + t*t*t*x1,
    m*m*m*y0 + 3*m*m*t*cy1 + 3*m*t*t*cy2 + t*t*t*y1
  ];
}

function bezAngle(x0,y0, cx1,cy1, cx2,cy2, x1,y1, t) {
  const m = 1-t;
  const dx = 3*m*m*(cx1-x0) + 6*m*t*(cx2-cx1) + 3*t*t*(x1-cx2);
  const dy = 3*m*m*(cy1-y0) + 6*m*t*(cy2-cy1) + 3*t*t*(y1-cy2);
  return Math.atan2(dy, dx);
}

/* ── THEME SYSTEM ─────────────────────────── */
function setTheme(color) {
  themeColor = color;
  document.querySelectorAll('#themeSelector button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function getThemeColors() {
  let c1, c2, c3;
  switch(themeColor) {
    case 'pink': c1='#ff6b8a'; c2='#ff8fa3'; c3='#ffb3c6'; break;
    case 'red': c1='#ff0040'; c2='#ff3366'; c3='#ff6b8a'; break;
    case 'purple': c1='#9b59b6'; c2='#bb8fce'; c3='#d7bde2'; break;
    case 'gold': c1='#f1c40f'; c2='#f7dc6f'; c3='#f9e79f'; break;
    case 'blue': c1='#3498db'; c2='#5dade2'; c3='#85c1e9'; break;
    case 'rainbow': 
      return { c1: `hsl(${Math.random()*360}, 100%, 60%)`, 
               c2: `hsl(${Math.random()*360}, 100%, 70%)`, 
               c3: `hsl(${Math.random()*360}, 100%, 80%)` };
    default: c1='#ff6b8a'; c2='#ff8fa3'; c3='#ffb3c6';
  }
  return { c1, c2, c3 };
}

  el.style.cssText = `
    left: ${x + xOffset}px;
    top: ${y}px;
    color: ${isLove ? colors.c1 : colors.c2};
    font-size: ${size}px;
    text-shadow: 0 0 40px ${colors.c1}80, 0 0 80px ${colors.c1}40;
    transform: translateY(0) scale(0.5);
    opacity: 0;
  `;
  
  document.body.appendChild(el);
  
  requestAnimationFrame(() => {
    el.style.opacity = '1';
    el.style.transform = `translateY(-${80 + Math.random() * 60}px) scale(1.2)`;
  });
  
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = `translateY(-${200 + Math.random() * 100}px) scale(0.8)`;
  }, 2500);
  
  setTimeout(() => el.remove(), 3500);
}

/* ── HEARTS ───────────────────────────────── */
function createHearts(x, y) {
  const colors = getThemeColors();
  for (let i = 0; i < 20; i++) {
    hearts.push({
      x, y,
      vx: (Math.random() - 0.5) * 8,
      vy: -2 - Math.random() * 6,
      size: 8 + Math.random() * 20,
      life: 1,
      color: i % 3 === 0 ? colors.c1 : (i % 3 === 1 ? colors.c2 : colors.c3),
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.1
    });
  }
}

/* ── FIREFLIES ────────────────────────────── */
function initFireflies() {
  for (let i = 0; i < 35; i++) {
    fireflies.push({
      x: Math.random() * W,
      y: Math.random() * H,
      angle: Math.random() * Math.PI * 2,
      radius: 50 + Math.random() * 180,
      speed: 0.005 + Math.random() * 0.02,
      size: 2 + Math.random() * 3.5,
      phase: Math.random() * Math.PI * 2,
      targetX: Math.random() * W,
      targetY: Math.random() * H,
      lerpSpeed: 0.001 + Math.random() * 0.003
    });

}
initFireflies();

/* ── STARS ────────────────────────────────── */
const STARS = Array.from({length: 220}, () => ({
  x: Math.random(), y: Math.random() * 0.80, r: Math.random() * 1.1 + 0.15,
  phase: Math.random() * Math.PI * 2, speed: 0.022 + Math.random() * 0.038,
  gold: Math.random() < 0.18
}));

const SPARKS = Array.from({length: 40}, () => { const s={}; resetSp(s); s.life=Math.random()*s.max; return s; });
function resetSp(s) {
  s.x = Math.random() * W;
  s.y = BASE - Math.random() * (H * 0.8);
  s.vy = -0.2 - Math.random()*0.5;
  s.life = 0; s.max = 0.6 + Math.random()*0.5; s.sz = 1.2 + Math.random()*2.0;
  s.hue = Math.random()*360;
}

/* ── ENVIRONMENT ─────────────────────────── */
function drawEnvironment() {
  const bg = ctx.createRadialGradient(CX, H*0.5, 10, CX, H*0.35, H*0.85);
  bg.addColorStop(0, '#221118');
  bg.addColorStop(0.4, '#0e0508');
  bg.addColorStop(0.8, '#040103');
  bg.addColorStop(1, '#000000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  
  const pool = ctx.createRadialGradient(CX, BASE, 10, CX, BASE-20, W);
  pool.addColorStop(0, 'rgba(40, 20, 10, 0.4)');
  pool.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pool;
  ctx.fillRect(0, 0, W, H);

  STARS.forEach(s => {
    s.phase += s.speed;
    const a = 0.15 + 0.48 * Math.abs(Math.sin(s.phase));
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fillStyle = s.gold ? `rgba(255,215,120,${a})` : `rgba(255,230,230,${a})`;
    ctx.fill();
  });

  SPARKS.forEach(s => {
    s.life += 0.005;
    if (s.life > s.max) resetSp(s);
    const a = Math.sin((s.life/s.max)*Math.PI) * 0.8;
    ctx.beginPath();
    ctx.arc(s.x + Math.sin(s.life*4)*5, s.y + s.vy*s.life*55, s.sz, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${s.hue},100%,82%,${a})`;
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Draw fireflies
  fireflies.forEach(f => {
    // Smooth movement
    f.x += (f.targetX - f.x) * f.lerpSpeed;
    f.y += (f.targetY - f.y) * f.lerpSpeed;
    
    if (Math.random() < 0.001) {
      f.targetX = Math.random() * W;
      f.targetY = Math.random() * H;
    }
    
    f.phase += 0.03;
    const glow = 0.3 + 0.7 * Math.abs(Math.sin(f.phase));
    const colors = getThemeColors();
    
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 200, ${glow * 0.5})`;
    ctx.shadowColor = colors.c1;
    ctx.shadowBlur = 30 * glow;
    ctx.fill();
    
    // Inner glow
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.size * 0.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${glow * 0.3})`;
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.shadowBlur = 0;
  });
}

/* ── FLOWER RENDERERS ────────────────────── */
function drawStem(x0,y0, cx1,cy1, cx2,cy2, x1,y1, prog, thick, col) {
  if (prog <= 0) return;
  ctx.beginPath();
  const steps = 48;
  for (let i = 0; i <= steps*prog; i++) {
    const [px,py] = bezPt(x0,y0,cx1,cy1,cx2,cy2,x1,y1, i/steps);
    i === 0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
  }
  ctx.strokeStyle = col; ctx.lineWidth = thick; ctx.lineCap = 'round';
  ctx.shadowColor = col; ctx.shadowBlur = 2; ctx.stroke(); ctx.shadowBlur = 0;
}

// LILY
function drawLilyLeaf(x, y, rot, size, prog) {
  if (prog <= 0) return;
  const s = size * prog;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(s * 0.15, s * 0.15, s, 0);
  ctx.quadraticCurveTo(s * 0.15, -s * 0.15, 0, 0);
  const lg = ctx.createLinearGradient(0, 0, s, 0);
  lg.addColorStop(0, '#2d5e20'); lg.addColorStop(1, '#509c3c');
  ctx.fillStyle = lg; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s * 0.5, 0, s * 0.9, 0);
  ctx.strokeStyle = 'rgba(0, 40, 0, 0.4)'; ctx.lineWidth = s * 0.02; ctx.stroke();
  ctx.restore();
}

function drawLilyFlower(x, y, size, prog, wob, stemAngle) {
  const s = size * prog * 1.6;
  const rot = (stemAngle + Math.PI/2) * 0.3 + wob;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, s * 0.7);
  pg.addColorStop(0, '#b8e69c'); pg.addColorStop(0.25, '#f5fceb');
  pg.addColorStop(0.8, '#ffffff'); pg.addColorStop(1, '#f2f2f2');

  const drawPetal = (rad, w) => {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-rad*0.3*w, -rad*0.3, -rad*0.2*w, -rad*0.8, 0, -rad);
    ctx.bezierCurveTo(rad*0.2*w, -rad*0.8, rad*0.3*w, -rad*0.3, 0, 0);
    ctx.fillStyle = pg; ctx.shadowColor = 'rgba(255, 255, 255, 0.5)'; ctx.shadowBlur = 10 * prog; ctx.fill();
    ctx.strokeStyle = 'rgba(100, 150, 80, 0.15)'; ctx.lineWidth = rad*0.015;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(rad*0.02, -rad*0.5, 0, -rad*0.9); ctx.stroke();
  }
  for (let i = 0; i < 3; i++) { ctx.save(); ctx.rotate((i * Math.PI*2/3)); drawPetal(s * 0.9, 0.85); ctx.restore(); }
  for (let i = 0; i < 3; i++) { ctx.save(); ctx.rotate((i * Math.PI*2/3) + Math.PI/3); ctx.shadowColor='rgba(0,0,0,0.2)'; ctx.shadowBlur=8; drawPetal(s, 1.0); ctx.restore(); }
  ctx.shadowBlur = 0;
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate((i * Math.PI*2/6) + Math.PI/6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s*0.11, -s*0.33, 0, -s*0.55);
    ctx.strokeStyle = '#cce3b6'; ctx.lineWidth = s*0.02; ctx.stroke();
    ctx.translate(0, -s*0.55); ctx.rotate(Math.PI/2 + 0.2);
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.04, s*0.12, 0, 0, Math.PI*2); ctx.fillStyle='#9c3d03'; ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s*0.65); ctx.strokeStyle='#9dc779'; ctx.lineWidth=s*0.035; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -s*0.65, s*0.04, 0, Math.PI*2); ctx.fillStyle='#7aab4d'; ctx.fill();
  ctx.restore();
}

  ctx.bezierCurveTo(s*0.1, -s*0.8, 0, -s*0.5, 0, -s*0.2); ctx.fill();
  ctx.fillStyle = '#ff0d3d'; ctx.beginPath(); ctx.moveTo(-s*0.35, -s*0.4);

// SUNFLOWER
function drawSunflowerLeaf(x, y, rot, size, prog) {
  if (prog <= 0) return; const s = size * prog;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s*0.4, s*0.3, s, 0); ctx.quadraticCurveTo(s*0.4, -s*0.3, 0, 0);
  const lg = ctx.createLinearGradient(0, 0, s, 0); lg.addColorStop(0, '#1b6522'); lg.addColorStop(1, '#348f32');
  ctx.fillStyle = lg; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s*0.5, 0, s*0.9, 0);
  ctx.strokeStyle='rgba(0, 50, 0, 0.4)'; ctx.lineWidth=s*0.03; ctx.stroke();
  ctx.restore();
}

function drawSunflowerFlower(x, y, size, prog, wob, stemAngle) {
  const s = size * prog * 1.5;
  const rot = (stemAngle + Math.PI/2) * 0.4 + wob;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);

  const drawRing = (rad, c, col, off, gl) => {
    ctx.fillStyle = col;
    if(gl){ ctx.shadowColor='#ff8c00'; ctx.shadowBlur=18*prog; } else { ctx.shadowBlur=4; ctx.shadowColor='rgba(0,0,0,0.5)';}
    for(let i=0; i<c; i++){
      ctx.save(); ctx.rotate((i/c)*Math.PI*2 + off);
      ctx.beginPath(); ctx.moveTo(0, -rad*0.1); ctx.quadraticCurveTo(rad*0.2, -rad*0.5, 0, -rad);
      ctx.quadraticCurveTo(-rad*0.2, -rad*0.5, 0, -rad*0.1); ctx.fill();
      ctx.strokeStyle='rgba(210, 100, 0, 0.3)'; ctx.lineWidth=rad*0.015;
      ctx.beginPath(); ctx.moveTo(0, -rad*0.2); ctx.lineTo(0, -rad*0.85); ctx.stroke(); ctx.restore();
    } ctx.shadowBlur=0;
  };
  ctx.fillStyle = '#1b6522';
  for (let i=0; i<16; i++) {
    ctx.save(); ctx.rotate((i/16)*Math.PI*2); ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(-s*0.08, -s*0.4); ctx.lineTo(0, -s*0.55); ctx.lineTo(s*0.08, -s*0.4); ctx.fill(); ctx.restore();
  }
  drawRing(s*0.95, 26, '#ffaa00', 0, true);
  drawRing(s*0.85, 26, '#ffd700', Math.PI/26, false);

  ctx.fillStyle='#4a2511'; ctx.beginPath(); ctx.arc(0,0,s*0.42,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#3a3b10'; ctx.beginPath(); ctx.arc(0,0,s*0.33,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1805'; ctx.beginPath(); ctx.arc(0,0,s*0.20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#6b4412';
  for (let i=0; i<200; i++) {
    const r = Math.sqrt(i)*(s*0.027); if(r > s*0.38) break;
    const a = i*2.39996; ctx.beginPath(); ctx.arc(Math.cos(a)*r, Math.sin(a)*r, s*0.012, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// TULIP
function drawTulipLeaf(x, y, rot, size, prog) {
  if (prog <= 0) return; const s = size * prog;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(s*0.3, s*0.25, s*0.8, s*0.1, s, 0);
  ctx.bezierCurveTo(s*0.8, -s*0.15, s*0.3, -s*0.25, 0, 0);
  const lg = ctx.createLinearGradient(0, 0, s, 0);
  lg.addColorStop(0, '#2e5441'); lg.addColorStop(0.5, '#4b7a62'); lg.addColorStop(1, '#335e47');
  ctx.fillStyle = lg; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(s*0.5, 0, s*0.9, 0);
  ctx.strokeStyle='rgba(255, 255, 255, 0.08)'; ctx.lineWidth=s*0.03; ctx.stroke();
  ctx.restore();
}

function drawTulipFlower(x, y, size, prog, wob, stemAngle) {
  const s = size * prog * 1.5;
  const rot = (stemAngle + Math.PI/2) * 0.2 + wob;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const pg = ctx.createLinearGradient(0, -s, 0, 0);
  pg.addColorStop(0, '#fce4ec'); pg.addColorStop(0.3, '#f48fb1');
  pg.addColorStop(0.7, '#d81b60'); pg.addColorStop(1, '#7a9650');
  ctx.fillStyle = pg; ctx.shadowColor = 'rgba(255, 105, 180, 0.5)'; ctx.shadowBlur = 15*prog;

  ctx.beginPath(); ctx.moveTo(-s*0.1, 0); ctx.bezierCurveTo(-s*0.35, -s*0.4, -s*0.25, -s*0.95, 0, -s*1.05); ctx.bezierCurveTo(s*0.25, -s*0.95, s*0.35, -s*0.4, s*0.1, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-s*0.4, -s*0.1, -s*0.55, -s*0.7, -s*0.3, -s*0.95); ctx.bezierCurveTo(-s*0.1, -s*0.8, 0, -s*0.4, 0, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(s*0.4, -s*0.1, s*0.55, -s*0.7, s*0.3, -s*0.95); ctx.bezierCurveTo(s*0.1, -s*0.8, 0, -s*0.4, 0, 0); ctx.fill();

  ctx.shadowBlur=5; ctx.shadowColor='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(-s*0.45, -s*0.3, -s*0.45, -s*0.85, -s*0.1, -s*1.0); ctx.bezierCurveTo(0, -s*0.8, s*0.1, -s*0.3, 0, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(s*0.45, -s*0.3, s*0.45, -s*0.85, s*0.1, -s*1.0); ctx.bezierCurveTo(0, -s*0.8, -s*0.1, -s*0.3, 0, 0); ctx.fill();

  const fg = ctx.createLinearGradient(0, -s, 0, 0);
  fg.addColorStop(0, '#ffffff'); fg.addColorStop(0.2, '#ff80ab'); fg.addColorStop(0.7, '#c2185b'); fg.addColorStop(1, '#556b2f');
  ctx.fillStyle = fg;
  ctx.beginPath(); ctx.moveTo(-s*0.15, 0); ctx.bezierCurveTo(-s*0.35, -s*0.4, -s*0.25, -s*0.9, 0, -s*0.95); ctx.bezierCurveTo(s*0.25, -s*0.9, s*0.35, -s*0.4, s*0.15, 0); ctx.fill();
  ctx.strokeStyle='rgba(255, 255, 255, 0.4)'; ctx.lineWidth=s*0.015; ctx.stroke();
  ctx.restore();
}

// GENERIC AESTHETIC
function drawGenericFlower(x, y, size, prog, wob) {
  const s = size * prog;
  const rot = wob;
  const colors = getThemeColors();
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.rotate((i/5)*Math.PI*2 - Math.PI/2);
    ctx.beginPath(); ctx.ellipse(0, -s*0.58, s*0.295, s*0.46, 0, 0, Math.PI*2);
    ctx.fillStyle = i % 2 === 0 ? colors.c1 : colors.c2;
    ctx.shadowColor = colors.c1;
    ctx.shadowBlur = 22*prog; ctx.fill(); ctx.restore();
  }
  const cg = ctx.createRadialGradient(0,0,0, 0,0,s*0.31);
  cg.addColorStop(0, '#fff8d0'); cg.addColorStop(0.42, '#ffcc44'); cg.addColorStop(1, '#ff9922');
  ctx.beginPath(); ctx.arc(0, 0, s*0.29, 0, Math.PI*2); ctx.fillStyle=cg; ctx.shadowColor='#ffcc44'; ctx.shadowBlur=24*prog; ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0, s*0.10, 0, Math.PI*2); ctx.fillStyle='rgba(255,252,200,0.92)'; ctx.shadowBlur=12*prog; ctx.fill(); ctx.restore();
}

/* ── FLOWER DEFINITIONS ──────────────────── */
const FLOWER_DEFS = {
  lily: { sd: '#234a1c', sl: '#468f3b', leaves: [0.2, 0.5, 0.8] },
  rose: { sd: '#1b6522', sl: '#2caa38', leaves: [] },
  sunflower: { sd: '#164a1a', sl: '#2caa38', leaves: [0.3, 0.6] },
  tulip: { sd: '#365e47', sl: '#518567', leaves: [0.2, 0.4] },
  generic: { sd: '#1b6522', sl: '#2caa38', leaves: [] }
};

/* ── CLICK HANDLER ────────────────────────── */
window.addEventListener('click', (e) => {
  if (currentScene !== 'garden') return; // only plant flowers while in the garden scene

  // Retry music start if autoplay was blocked earlier
  if (!musicOn) tryPlayMusic();

  const types = Object.keys(FLOWER_DEFS);
  const type = types[Math.floor(Math.random() * types.length)];
  const def = FLOWER_DEFS[type];

  let tx = e.clientX;
  let ty = e.clientY;
  
  if (ty > BASE - 100) ty = BASE - 100;

  const size = (30 + Math.random() * 25) * SC;

  // Overlap prevention
  let overlapping = true;
  let attempts = 0;
  while(overlapping && attempts < 15) {
    overlapping = false;
    for(let f of flowers) {
      let dx = tx - f.tx;
      let dy = ty - f.ty;
      let minDist = (size + f.size) * 0.8;
      if(dx*dx + dy*dy < minDist*minDist) {
        tx += (Math.random() > 0.5 ? 1 : -1) * minDist;
        ty += (Math.random() - 0.5) * minDist;
        overlapping = true;
        break;
      }
    }
    attempts++;
  }
  
  if (tx < 50) tx = 50;
  if (tx > W - 50) tx = W - 50;
  if (ty < 50) ty = 50;
  if (ty > BASE - 100) ty = BASE - 100;

  const xSpread = ((tx / W) - 0.5) * 200;
  const bx = CX + xSpread;
  const by = BASE + Math.random() * 20;

  const cp1x = bx;
  const cp1y = by - Math.abs(by - ty) * 0.4;
  const cp2x = tx - (tx - bx) * 0.2;
  const cp2y = ty + Math.abs(by - ty) * 0.4;

  flowers.push({
    type,
    bx, by, tx, ty,
    cp1x, cp1y, cp2x, cp2y,
    size: size,
    thick: (3 + Math.random() * 1.5) * SC,
    startTime: Date.now(),
    duration: 2500 + Math.random() * 1500,
    wobble: Math.random() * Math.PI * 2,
    sd: def.sd, sl: def.sl, leaves: def.leaves,
    dir: Math.random() < 0.5 ? 1 : -1
  });

  // Keep only the most recent flowers on screen — without this cap, every
  // flower ever planted keeps getting redrawn (expensive bezier curves +
  // shadows) every single frame, and the garden gets laggier the more you click.
  const MAX_FLOWERS = 45;
  if (flowers.length > MAX_FLOWERS) {
    flowers.splice(0, flowers.length - MAX_FLOWERS);
  }
  
  flowerCount++;
  document.getElementById('flowerCount').textContent = flowerCount;

  // Create hearts
  createHearts(tx, ty);

  // Show floating text
  const isLove = Math.random() < 0.6;
  const msg = isLove ?
    loveMessages[Math.floor(Math.random() * loveMessages.length)] :
    loveInLanguages[Math.floor(Math.random() * loveInLanguages.length)];
  showFloatingText(tx, ty, msg, isLove);

});

/* ── MUSIC (toggle button still works, using local file) ── */
function toggleMusic() {
  if (!musicOn) {
    tryPlayMusic();
  } else {
    bgMusic.pause();
    musicOn = false;
    document.getElementById('musicBtn').textContent = '🎵 Play Music';
  }
}
document.getElementById('musicBtn').addEventListener('click', toggleMusic);

/* ── LIVE LOVE TIMER (years / months / days / hours / minutes / seconds) ── */
function updateTimer() {
  const target = new Date(LOVE_START_DATE);
  const now = new Date();
  let diffMs = now - target;
  if (diffMs < 0) diffMs = 0;

  let years = now.getFullYear() - target.getFullYear();
  let months = now.getMonth() - target.getMonth();
  let days = now.getDate() - target.getDate();
  if (days < 0) {
    months -= 1;
    const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
    days += prevMonth.getDate();
  }
  if (months < 0) { years -= 1; months += 12; }

  const totalSeconds = Math.floor(diffMs / 1000);
  const hours = Math.floor(totalSeconds / 3600) % 24;
  const minutes = Math.floor(totalSeconds / 60) % 60;
  const seconds = totalSeconds % 60;

  const label = `${years}y ${months}m ${days}d ${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
  const el = document.getElementById('daysCount');
  if (el) el.textContent = label;
}
updateTimer();
setInterval(updateTimer, 1000);

/* ── TRAIL ────────────────────────────────── */
canvas.addEventListener('mousemove', (e) => {
  trail.push({x: e.clientX, y: e.clientY, life: 1});
  if (trail.length > 60) trail.shift();
});

/* ── DRAW LOOP ───────────────────────────── */
let gardenLoopRunning = false;
function draw() {
  if (currentScene !== 'garden') {
    gardenLoopRunning = false;
    return; // stop the loop entirely while another scene is showing — resumed by goToScene()
  }
  gardenLoopRunning = true;
  ctx.clearRect(0, 0, W, H);
  drawEnvironment();

  // Draw trail
  const colors = getThemeColors();
  trail.forEach((t, i) => {
    t.life -= 0.015;
    if (t.life > 0) {
      ctx.beginPath();
      ctx.arc(t.x, t.y, 3 * t.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${i * 8 + Date.now() * 0.01 % 360}, 100%, 70%, ${t.life * 0.3})`;
      ctx.shadowColor = colors.c1;
      ctx.shadowBlur = 15;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  });
  trail.forEach((t, i) => { if (t.life <= 0) trail.splice(i, 1); });

  // Draw hearts
  hearts.forEach((h, i) => {
    h.x += h.vx;
    h.y += h.vy;
    h.vy += 0.05;
    h.rotation += h.rotSpeed;
    h.life -= 0.008;
    
    if (h.life <= 0) hearts.splice(i, 1);
    else {
      ctx.save();
      ctx.globalAlpha = h.life;
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rotation);
      ctx.font = `${h.size}px "Arial"`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = h.color;
      ctx.shadowColor = h.color;
      ctx.shadowBlur = 20;
      ctx.fillText('♥', 0, 0);
      ctx.restore();
    }
  });

  // Draw flowers
  const now = Date.now();
  const t = now - START;

  flowers.forEach((f) => {
    const rawP = Math.min((now - f.startTime) / f.duration, 1);
    const sp = easeOut(rawP);
    const fp = easeOut(clamp((rawP - 0.5) / 0.5, 0, 1));

    drawStem(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, sp, f.thick, f.sd);
    drawStem(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, sp, f.thick * 0.5, f.sl);

    f.leaves.forEach((lt, i) => {
      if (sp > lt) {
        const [lx, ly] = bezPt(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, lt);
        const lAngle = bezAngle(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, lt);
        const lDir = i % 2 === 0 ? f.dir : -f.dir;
        const lProg = clamp((sp - lt) * 4, 0, 1);

        if (f.type === 'lily') {
          drawLilyLeaf(lx, ly, lAngle + (Math.PI / 2.8) * lDir, f.size * 1.5, lProg);
        } else if (f.type === 'sunflower') {
          drawSunflowerLeaf(lx, ly, lAngle + (Math.PI / 2.5) * lDir, f.size * 1.6, lProg);
        } else if (f.type === 'tulip') {
          drawTulipLeaf(lx, ly, lAngle + (Math.PI / 8) * lDir, f.size * 2.2, lProg);
        }
      }
    });

    const [fx, fy] = bezPt(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, Math.min(sp, 1));
    const angle = bezAngle(f.bx, f.by, f.cp1x, f.cp1y, f.cp2x, f.cp2y, f.tx, f.ty, Math.min(sp, 1));
    const wob = Math.sin(t * 0.0013 + f.wobble) * 0.05;

    if (f.type === 'lily') drawLilyFlower(fx, fy, f.size, fp, wob, angle);
    else if (f.type === 'rose') drawRoseFlower(fx, fy, f.size, fp, wob, angle);
    else if (f.type === 'sunflower') drawSunflowerFlower(fx, fy, f.size, fp, wob, angle);
    else if (f.type === 'tulip') drawTulipFlower(fx, fy, f.size, fp, wob, angle);
    else if (f.type === 'generic') drawGenericFlower(fx, fy, f.size, fp, wob);
  });

  requestAnimationFrame(draw);
}

draw();
</script>
